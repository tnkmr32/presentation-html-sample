<text x="340" y="133" text-anchor="end" font-size="18" fill="#222222">METR実測(2025)</text>
<rect x="391.8" y="26" width="435.2" height="34" rx="2" fill="#66d6e2" stroke="#222222" stroke-width="2"/>
<text x="609.4" y="49" text-anchor="middle" font-size="18" font-weight="bold" fill="#222222">−55.8%(短縮)</text>
