<text x="733.4" y="93" text-anchor="middle" font-size="18" font-weight="bold" fill="#222222">−24%(予想)</text>
<rect x="827" y="114" width="148.2" height="34" rx="2" fill="#66d6e2" stroke="#222222" stroke-width="2"/>
<text x="901.1" y="137" text-anchor="middle" font-size="18" font-weight="bold" fill="#222222">+19%(遅延)</text>
<line x1="827" y1="16" x2="827" y2="154" stroke="#222222" stroke-width="3"/>
<line x1="359" y1="154" x2="1061" y2="154" stroke="#5c5c5c" stroke-width="2"/>
<line x1="359.0" y1="154" x2="359.0" y2="160" stroke="#5c5c5c" stroke-width="2"/>
<text x="359.0" y="178" text-anchor="middle" font-size="18" fill="#222222">−60</text>
<line x1="593.0" y1="154" x2="593.0" y2="160" stroke="#5c5c5c" stroke-width="2"/>
<text x="593.0" y="178" text-anchor="middle" font-size="18" fill="#222222">−30</text>
